<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POD SEO Generator - Kotosai Special</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #f8f9fa; color: #333; margin: 0; }
    h2 { font-size: 1.2rem; text-align: center; margin-bottom: 15px; color: #1a1a1a; }
    .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
    label { font-size: 0.85rem; font-weight: bold; color: #555; display: block; margin-bottom: 5px; }
    input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 0.9rem; margin-bottom: 10px; }
    input[type="file"] { display: none; }
    .file-btn { display: block; text-align: center; background: #e9ecef; border: 2px dashed #adb5bd; border-radius: 8px; padding: 20px; color: #495057; font-weight: bold; cursor: pointer; }
    #preview { max-width: 100%; max-height: 200px; display: block; margin: 10px auto 0; border-radius: 8px; }
    button.run-btn { width: 100%; padding: 14px; background: #0d6efd; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    button.run-btn:disabled { background: #6c757d; }
    .output-group { margin-top: 15px; }
    .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .output-header span { font-size: 0.85rem; font-weight: bold; color: #333; }
    .copy-btn { background: #20c997; color: white; border: none; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
    textarea { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; font-size: 0.85rem; box-sizing: border-box; height: 80px; resize: vertical; background: #fafafa; }
    #loading { text-align: center; font-weight: bold; color: #0d6efd; display: none; margin: 15px 0; }
  </style>
</head>
<body>

  <h2>🎨 POD SEO Generator</h2>

  <div class="card">
    <label>Google AI Studio API Key</label>
    <input type="password" id="apiKey" placeholder="先ほどコピーしたAPIキーを貼り付け">
    
    <label>画像を選択</label>
    <label for="imageInput" class="file-btn">📷 画像を選択する</label>
    <input type="file" id="imageInput" accept="image/*">
    <img id="preview" style="display:none;">
  </div>

  <button class="run-btn" id="runBtn" onclick="generateSEO()">✨ SEOデータを出力する</button>

  <div id="loading">⏳ 画像を分析してSEOテキストを作成中...</div>

  <div class="card" id="resultCard" style="display:none;">
    <div class="output-group">
      <div class="output-header">
        <span>Title (Redbubble / TeePublic共通)</span>
        <button class="copy-btn" onclick="copyText('outTitle')">コピー</button>
      </div>
      <textarea id="outTitle" readonly></textarea>
    </div>

    <div class="output-group">
      <div class="output-header">
        <span>Main Tag (TeePublic用)</span>
        <button class="copy-btn" onclick="copyText('outMainTag')">コピー</button>
      </div>
      <textarea id="outMainTag" style="height: 40px;" readonly></textarea>
    </div>

    <div class="output-group">
      <div class="output-header">
        <span>Tags (カンマ区切り 15-20個)</span>
        <button class="copy-btn" onclick="copyText('outTags')">コピー</button>
      </div>
      <textarea id="outTags" style="height: 100px;" readonly></textarea>
    </div>

    <div class="output-group">
      <div class="output-header">
        <span>Description (商品説明文 100-180語)</span>
        <button class="copy-btn" onclick="copyText('outDesc')">コピー</button>
      </div>
      <textarea id="outDesc" style="height: 120px;" readonly></textarea>
    </div>
  </div>

  <script>
    let base64Image = "";

    // 画像読み込みとプレビュー
    document.getElementById('imageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        base64Image = evt.target.result.split(',')[1];
        const preview = document.getElementById('preview');
        preview.src = evt.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    async function generateSEO() {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) { alert('APIキーを入力してください'); return; }
      if (!base64Image) { alert('画像を選択してください'); return; }

      document.getElementById('loading').style.display = 'block';
      document.getElementById('runBtn').disabled = true;
      document.getElementById('resultCard').style.display = 'none';

      const promptText = `
あなたはRedbubbleおよびTeePublic向けのトップSEO専門家です。
アップロードされた画像を分析し、検索最適化された英語のタイトル、メインタグ、サブタグ、商品説明文を作成してください。

【厳格なルール】
1. タイトル: 作品ごとに毎回変化をつける。検索キーワードを前方に配置。
2. メインタグ: 作品ごとに最も適した1単語〜数単語のキーフレーズ。
3. サブタグ: カンマ区切りで15〜20個。
   - ※重要: "kotosai" はタグに絶対に入れないこと！
   - ポーズ、表情、髪色、衣装・柄（桜、鶴、青海波、格子、虎柄など）の特徴を重視。
   - 重複を避け、海外のアニメ・日本文化ファンに響くSEO用キーワードを選ぶ。
4. 商品説明 (Description): 100〜180語程度の自然で高品質な英語。
   - 文章中にブランド名 "Kotosai" を自然に含める。
   - "Hydro Flask" などの登録商標は使用せず、"water bottles" や "laptops" など一般名詞を使用する。
5. 出力フォーマット: 必ず以下のJSON形式のみで返答してください（余計な解説文やバッククォートmarkdownは不要）。

{
  "title": "ここにタイトル",
  "mainTag": "ここにメインタグ",
  "tags": "tag1, tag2, tag3, ...",
  "description": "ここに100-180語の商品説明"
}
`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
              ]
            }]
          })
        });

        const data = await response.json();
        let rawText = data.candidates[0].content.parts[0].text;
        
        // JSONクリーンアップ処理
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        const jsonResult = JSON.parse(rawText);

        document.getElementById('outTitle').value = jsonResult.title || '';
        document.getElementById('outMainTag').value = jsonResult.mainTag || '';
        document.getElementById('outTags').value = jsonResult.tags || '';
        document.getElementById('outDesc').value = jsonResult.description || '';

        document.getElementById('resultCard').style.display = 'block';
      } catch (err) {
        alert('エラーが発生しました。APIキーまたは画像を確認してください。');
        console.error(err);
      } finally {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('runBtn').disabled = false;
      }
    }

    function copyText(id) {
      const textarea = document.getElementById(id);
      textarea.select();
      textarea.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(textarea.value);
      alert('コピーしました！');
    }
  </script>
</body>
</html>
